---
modules-search: [ local ]

instances:
- id: cleanup
  module: shellprocess
  config: shellprocess_cleanup.conf

sequence:
#экраны
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
#установка
- exec:
  - partition
  - mount
  - unpackfs
  - shellprocess@cleanup
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - luksopenswaphookcfg
  - initramfscfg
  - initramfs
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: lucix
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
