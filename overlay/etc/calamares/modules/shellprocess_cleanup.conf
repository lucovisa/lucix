---
#чистим live следы до создания пользователя
dontChroot: false
timeout: 900
script:
  - "DEBIAN_FRONTEND=noninteractive apt-get -y purge casper calamares || true"
  - "DEBIAN_FRONTEND=noninteractive apt-get -y autoremove --purge || true"
  - "rm -f /usr/share/applications/lucix-install.desktop /etc/skel/Desktop/lucix-install.desktop /etc/casper.conf"
  - "rmdir /etc/skel/Desktop 2>/dev/null || true"
