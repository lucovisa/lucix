---
#чистим live следы до создания пользователя
dontChroot: false
timeout: 900
script:
  - "apt-mark manual grub-efi-amd64-bin grub-efi-amd64-signed shim-signed grub-pc-bin grub-common efibootmgr os-prober dosfstools e2fsprogs || true"
  - "DEBIAN_FRONTEND=noninteractive apt-get -y purge casper calamares || true"
  - "DEBIAN_FRONTEND=noninteractive apt-get -y autoremove --purge || true"
  - "rm -f /usr/share/applications/lucix-install.desktop /etc/skel/Desktop/lucix-install.desktop /etc/casper.conf"
  - "rm -rf /usr/lib/lucix/install-launcher.py /usr/lib/lucix/lucixdisk.py /usr/lib/lucix/__pycache__ /usr/lib/x86_64-linux-gnu/calamares /etc/calamares/settings.auto.conf /etc/calamares/settings.manual.conf"
  - "rmdir /etc/skel/Desktop 2>/dev/null || true"
