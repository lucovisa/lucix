name: Build Lucix

on:
  #ручной запуск
  workflow_dispatch:
    inputs:
      version:
        description: "Версия например 2026.10.23-alpha1 или пусто для dev"
        required: false
        default: ""
      iso:
        description: "Собрать ISO (долго). Без галочки собираются только пакеты"
        type: boolean
        required: false
        default: false
  #релиз по тегу
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Определяем версию
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            v="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            v="$INPUT_VERSION"
          else
            v="$(date -u +%Y.%m.%d)-dev"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Режим сборки
        id: mode
        env:
          INPUT_ISO: ${{ inputs.iso }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$INPUT_ISO" == "true" ]]; then
            echo "iso=true" >> "$GITHUB_OUTPUT"
            echo "Режим: пакеты и ISO"
          else
            echo "iso=false" >> "$GITHUB_OUTPUT"
            echo "Режим: только пакеты"
          fi

      - name: Освобождаем место
        if: steps.mode.outputs.iso == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / /mnt

      - name: Ставим инструменты
        if: steps.mode.outputs.iso == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin grub-common mtools dosfstools ubuntu-keyring \
            qemu-system-x86 ovmf socat

      - name: Скачиваем тему загрузчика
        run: git clone --depth 1 https://github.com/Lxtharia/minegrub-world-sel-theme.git build/third-party/minegrub

      - name: Собираем пакеты lucix
        env:
          LUCIX_VERSION: ${{ steps.ver.outputs.version }}
        run: bash ./build/build-debs.sh

      - name: Собираем ISO
        if: steps.mode.outputs.iso == 'true'
        env:
          LUCIX_VERSION: ${{ steps.ver.outputs.version }}
        run: sudo -E bash ./build/build-iso.sh

      - name: Права на out
        if: steps.mode.outputs.iso == 'true'
        run: sudo chown -R "$USER" out

      - name: Проверяем размер
        if: steps.mode.outputs.iso == 'true'
        run: |
          ls -lh out/
          size=$(stat -c %s out/*.iso)
          echo "Размер ISO: $((size / 1024 / 1024)) МБ"
          if (( size > 2000 * 1024 * 1024 )); then
            echo "::error::ISO больше 2 ГБ"
            exit 1
          fi

      - name: Сохраняем ISO и пакеты
        if: steps.mode.outputs.iso == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lucix-iso-${{ steps.ver.outputs.version }}
          path: |
            out/*.iso
            out/*.sha256
            out/skipped-packages.txt
            out/debs/*
          compression-level: 0
          retention-days: 14

      - name: Сохраняем пакеты
        if: steps.mode.outputs.iso != 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: lucix-debs-${{ steps.ver.outputs.version }}
          path: out/debs/*
          retention-days: 14

      - name: Включаем kvm
        if: steps.mode.outputs.iso == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "kvm нет будет медленный режим"

      - name: Тест загрузки в qemu
        if: steps.mode.outputs.iso == 'true'
        id: boot
        continue-on-error: true
        env:
          MAXWAIT: "1500"
        run: bash ./build/test-boot.sh out/lucix-*.iso out/test

      - name: Сохраняем скриншоты и лог
        if: always() && steps.mode.outputs.iso == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lucix-test-${{ steps.ver.outputs.version }}
          path: |
            out/test/*.png
            out/test/serial.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Публикуем релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/debs/*.deb
            out/debs/SHA256SUMS
          prerelease: ${{ contains(github.ref_name, 'pre') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
